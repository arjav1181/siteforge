name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The OSS-skill tests count what the submodules contribute. Without
          # this the runner checks out empty directories and two tests fail on
          # every single run.
          submodules: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # No lockfile committed — plain install.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      # Before the tests, not after: the CLI tests spawn dist/cli.js, so
      # building last meant they tested a binary that did not exist yet.
      - name: Build
        run: npm run build

      - name: Tests (unit + e2e)
        run: npm test

      - name: Smoke test CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js add --list
          node dist/cli.js fx --list

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint install.sh
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning install.sh